plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
apply from: 'common.gradle'
dependencies {
    minecraft "com.mojang:minecraft:${minecraft}"
    implementation "net.fabricmc:fabric-loader:${target.fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${target.fabric_api}"
    if (project.hasProperty('rinlibJar')) implementation files(project.property('rinlibJar'))
    else implementation "maven.modrinth:rinlib:${releaseProperties.rinlib_version}+${minecraft}-fabric"
}
