pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }
rootProject.name = 'kill-confirmed-profile'
def mc = gradle.startParameter.projectProperties['profile']
def loader = gradle.startParameter.projectProperties['loader']
if (!mc || !(loader in ['fabric', 'neoforge'])) throw new GradleException('Use -Pprofile=<Minecraft> -Ploader=fabric|neoforge')
rootProject.buildFileName = loader == 'fabric' && mc.startsWith('26.') ? 'fabric-modern.gradle' : "${loader}.gradle"
