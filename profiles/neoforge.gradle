plugins { id 'net.neoforged.moddev' version '2.0.144' }
apply from: 'common.gradle'
dependencies {
    def rinlib = "maven.modrinth:rinlib:${releaseProperties.rinlib_version}+${minecraft}-neoforge"
    if (project.hasProperty('rinlibJar')) {
        def localJar = file(project.property('rinlibJar'))
        // jarJar requires module coordinates for local jars without Automatic-Module-Name.
        repositories { flatDir { dirs localJar.parentFile } }
        rinlib = dependencies.create("dev.rinchan:rinlib-neoforge:${releaseProperties.rinlib_version}+${minecraft}") {
            artifact { name = localJar.name - '.jar'; type = 'jar'; extension = 'jar' }
        }
    }
    add(Boolean.getBoolean('probe.bundled') ? 'compileOnly' : 'implementation', rinlib)
    jarJar rinlib
}
neoForge {
    version = target.neo
    mods { kill_confirmed { sourceSet(sourceSets.main) } }
}
