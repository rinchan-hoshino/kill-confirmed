plugins { id 'net.neoforged.moddev' version '2.0.144' }
apply from: 'common.gradle'
dependencies {
    // NeoForge supplies NightConfig in its boot layer; bundling it creates duplicate modules.
    compileOnly 'com.electronwill.night-config:toml:3.8.3'
}
neoForge {
    version = target.neo
    mods { kill_confirmed { sourceSet(sourceSets.main) } }
}
