plugins { id 'fabric-loom' version '1.14.7' }
apply from: 'common.gradle'
dependencies {
    minecraft "com.mojang:minecraft:${minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${target.fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabric_api}"
    def rinlib = "maven.modrinth:rinlib:${releaseProperties.rinlib_version}+${minecraft}-fabric"
    if (project.hasProperty('rinlibJar')) {
        def localJar = file(project.property('rinlibJar'))
        repositories { flatDir { dirs localJar.parentFile } }
        rinlib = dependencies.create("dev.rinchan:rinlib-fabric:${releaseProperties.rinlib_version}+${minecraft}") {
            artifact { name = localJar.name - '.jar'; type = 'jar'; extension = 'jar' }
        }
    }
    add(Boolean.getBoolean('probe.bundled') ? 'modCompileOnly' : 'modImplementation', rinlib)
    include rinlib
}
