# Where the dog tag goes: "death_position" (drops where you died) or "respawn_inventory" (given to you on respawn)
drop = "death_position"
# Only create a dog tag when another player is the killer
player_kills_only = false
# Keep dropped dog tags and dog tag cases immune to fire and lava
fire_resistant = true
# Per-player cooldown in seconds between dog tag drops (0 = unlimited)
cooldown_seconds = 0
# Enable crafting recipe for the Dog Tag Case
enable_dog_tag_case_recipe = true
# Enable rare Dog Tag Case loot in structure chests (Ancient City, Stronghold, Bastion, Mineshaft, Mansion)
enable_case_loot = true
# Enable Wandering Trader rare trade (20 emeralds -> 1 Dog Tag Case)
enable_wanderer_trade = true
# Optional mcfunction id, run as the dead player at the death position (permission level 2, output silenced) right before the tag is built.
function = ""
# One entry per lore line, each a JSON text component. {"placeholder":"<name>"} inserts a value.
# Built-in placeholders: player, killer, weapon, death_message, location, x, y, z, dimension, level, day.
lore = [
  '{"placeholder":"death_message","color":"#CCCCCC","italic":false}',
  '{"text":"","color":"#808080","italic":false,"extra":[{"text":"⌖ ","color":"#808080"},{"placeholder":"location","color":"#CCCCCC"},{"text":" · (","color":"#808080"},{"placeholder":"x","color":"#808080"},{"text":", ","color":"#808080"},{"placeholder":"y","color":"#808080"},{"text":", ","color":"#808080"},{"placeholder":"z","color":"#808080"},{"text":")","color":"#808080"}]}',
  '{"text":"","color":"#707070","italic":false,"extra":[{"text":"✦ ","color":"#707070"},{"translate":"kill_confirmed.lore.level_day","color":"#D8C088","with":[{"placeholder":"level","color":"#D8C088"},{"placeholder":"day","color":"#D8C088"}]}]}',
]
