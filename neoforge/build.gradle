plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

def root = rootProject
def modId = root.property('mod_id')
def apiLayer = root.api_layer

base {
    archivesName = "${modId}-neoforge"
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.java.srcDir root.file("common/src/${apiLayer}/java")
if (apiLayer == 'v26') {
    sourceSets.main.java.srcDir root.file(root.minecraft_version == '26.3' ? 'common/src/v26_3/java' : 'common/src/v26_1/java')
}
sourceSets.main.resources.srcDir root.file('common/src/main/resources')
sourceSets.main.resources.srcDir root.file("common/src/${apiLayer}/resources")
sourceSets.test.java.srcDir root.file('common/src/test/java')
if (apiLayer == 'v121') {
    sourceSets.test.java.srcDir 'src/testV121/java'
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

if (root.minecraft_version == '1.21.1') {
    sourceSets {
        gameTest {
            java.setSrcDirs(['src/gametest/java'])
            resources.setSrcDirs(['src/gametest/resources'])
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
    }
}
sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: root.minecraft_version_range,
        neo_version_range      : root.neo_version_range,
        loader_version_range   : root.property('loader_version_range'),
        mod_id                 : modId,
        mod_name               : root.property('mod_name'),
        mod_license            : root.property('mod_license'),
        mod_version            : root.property('mod_version'),
        mod_authors            : root.property('mod_authors'),
        mod_description        : root.property('mod_description'),
        icon_property          : root.minecraft_version in ['26.2', '26.3'] ? 'iconFile' : 'logoFile'
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

neoForge {
    version = root.neo_version
    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
        if (root.minecraft_version == '1.21.1') {
            kill_confirmed_e2e {
                sourceSet(sourceSets.gameTest)
            }
        }
    }
    unitTest {
        enable()
        testedMod = mods."${modId}"
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        if (root.minecraft_version == '1.21.1') {
            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = layout.buildDirectory.dir('run-gametest')
                loadedMods = [mods.kill_confirmed_e2e]
                systemProperty 'neoforge.enabledGameTestNamespaces', 'kill_confirmed_e2e'
            }
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

neoForge.ideSyncTask tasks.named('generateModMetadata')

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    dependsOn(tasks.named('jar'))
    useJUnitPlatform()
    doFirst {
        systemProperty 'killconfirmed.jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'killconfirmed.projectRoot', root.projectDir.absolutePath
        systemProperty 'killconfirmed.apiLayer', apiLayer
        systemProperty 'killconfirmed.loader', 'neoforge'
        if (System.getProperty('killconfirmed.scanAllReleases') != null) {
            systemProperty 'killconfirmed.scanAllReleases', System.getProperty('killconfirmed.scanAllReleases')
        }
    }
}

if (root.minecraft_version == '1.21.1') {
    def stagePackagedJar = tasks.register('stagePackagedJarForGameTest', Sync) {
        dependsOn(tasks.named('jar'))
        from(tasks.named('jar').flatMap { it.archiveFile })
        into(layout.buildDirectory.dir('run-gametest/mods'))
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        dependsOn(stagePackagedJar)
        doFirst {
            delete(layout.buildDirectory.file('run-gametest/config/kill_confirmed.toml'))
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-neoforge"
            from components.java
        }
    }
}
