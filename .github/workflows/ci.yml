name: CI

on:
  push:
    branches: [main, "rework/**"]
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: echo "JAVA_17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: echo "JAVA_21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: echo "JAVA_25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Build all 8 targets & run unit tests
        run: python3 scripts/build-matrix.py

      - name: Upload release JARs
        uses: actions/upload-artifact@v4
        with:
          name: kill-confirmed-matrix
          path: build/releases/*
