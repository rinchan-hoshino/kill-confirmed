plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom'
}

def root = rootProject
def modId = root.property('mod_id')

base { archivesName = "${modId}-fabric" }

sourceSets.main.java.srcDirs += [
        root.file('common/src/main/java'),
        root.file('portable/src/main/java')
]
sourceSets.main.resources.srcDir root.file('common/src/main/resources')


dependencies {
    minecraft "com.mojang:minecraft:${root.property('minecraft_version')}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${root.property('fabric_loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${root.property('fabric_api_version')}"
    modImplementation "maven.modrinth:rinlib:${root.property('rinlib_version')}+${root.property('minecraft_version')}-fabric"
}

def resourceProperties = [
        mod_id: modId,
        mod_name: root.property('mod_name'),
        mod_version: root.property('mod_version'),
        mod_license: root.property('mod_license'),
        mod_authors: root.property('mod_authors'),
        mod_description: root.property('mod_description'),
        minecraft_version: root.property('minecraft_version'),
        fabric_loader_version: root.property('fabric_loader_version'),
        fabric_api_version: root.property('fabric_api_version'),
        rinlib_version: root.property('rinlib_version')
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching('fabric.mod.json') { expand resourceProperties }
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE_kill_confirmed' }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-fabric"
            artifact(tasks.named('remapJar'))
        }
    }
}
